<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18181b"/>
      <stop offset="100%" style="stop-color:#27272a"/>
    </linearGradient>

    <!-- 主色渐变 (accent green) -->
    <radialGradient id="accentGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </radialGradient>

    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 阴影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="6" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景 - 圆角矩形 -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>

  <!-- 外发光效果 -->
  <circle cx="512" cy="512" r="380" fill="#10b981" opacity="0.15" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="350" fill="#10b981" opacity="0.2" filter="url(#glow)"/>

  <!-- 主圆形 - 专辑封面风格 -->
  <circle cx="512" cy="512" r="320" fill="url(#accentGradient)"/>

  <!-- 内圈高光 -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="512" cy="512" r="260" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- 播放按钮 -->
  <g filter="url(#shadow)">
    <path d="M 482 232 L 482 792 L 662 512 Z" fill="white"/>
  </g>

  <!-- 音符装饰 - 左上角 -->
  <g transform="translate(260, 260)" fill="white" opacity="0.7">
    <!-- 音符头 -->
    <ellipse cx="20" cy="60" rx="20" ry="15" transform="rotate(-25, 20, 60)"/>
    <!-- 音符杆 -->
    <rect x="35" y="0" width="10" height="120" rx="5"/>
    <!-- 音符旗 -->
    <path d="M 45 0 Q 75 20 70 50 L 45 35 Z"/>
  </g>

  <!-- 音符装饰 - 右下角 -->
  <g transform="translate(700, 680)" fill="white" opacity="0.4">
    <ellipse cx="12" cy="38" rx="12" ry="9" transform="rotate(-25, 12, 38)"/>
    <rect x="20" y="0" width="6" height="80" rx="3"/>
  </g>
</svg>